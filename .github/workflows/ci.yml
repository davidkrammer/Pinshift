name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test native protocol and local TLS
        run: xcodebuild -project Pinshift.xcodeproj -scheme Pinshift -destination 'platform=macOS' CODE_SIGN_IDENTITY=- test
      - name: Build iPhone companion
        run: xcodebuild -project Pinshift.xcodeproj -scheme PinshiftRemote -destination 'generic/platform=iOS Simulator' CODE_SIGN_IDENTITY=- build
      - name: Test location recovery worker
        run: python3 -m unittest discover -s Tests/Python -v
      - name: Validate installer
        run: bash -n Scripts/install_app.sh
